# ==============================================================================
# Ghost Shopper - Multi-Container Infrastructure
# ==============================================================================
# NOTE: Worker sandbox containers are NOT defined here. They are dynamically
# provisioned and lifecycle-managed on-demand by the FastAPI Orchestrator via the
# Docker SDK (using gVisor runsc runtime when configured).
# ==============================================================================

version: '3.8'

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: ghost-shopper-orchestrator
    ports:
      - "8000:8000"
    volumes:
      # Docker socket mount enables orchestrator to spawn and monitor sandboxes
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared workspace for storing scrape artifacts, logs, and screenshots.
      #
      # Both halves of the mount path matter and neither is obvious:
      #
      #   /opt/ghost-shopper/workspace  - HOST side. Must be an absolute host
      #     path, not the relative ./workspace, because the sandbox containers
      #     are created by the orchestrator through the Docker socket and their
      #     bind source is interpreted by the HOST daemon. Given ./workspace,
      #     dockerd resolves it against *its* cwd (/opt/ghost-shopper/GhostShopper),
      #     so the sandbox would mount a different directory from the one the
      #     orchestrator writes into.
      #
      #   /opt/ghost-shopper/GhostShopper/workspace  - CONTAINER side. This is
      #     what WORKSPACE_DIR expects (/app/workspace -> /app/workspace), and it
      #     is also the source sandbox_manager passes for the sandbox bind. One
      #     host directory therefore serves both mounts: the orchestrator creates
      #     the task dir, the sandbox writes the screenshot into the same place.
      #   Override with GHOST_WORKSPACE_HOST_PATH if the repo lives elsewhere.
      - ${GHOST_WORKSPACE_HOST_PATH:-/opt/ghost-shopper/GhostShopper/workspace}:/app/workspace
    env_file:
      - .env
    networks:
      - ghost-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  ghost-net:
    name: ghost-net
    driver: bridge

volumes:
  workspace-data:
    name: ghost-shopper-workspace-data
